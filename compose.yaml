name: transcript-library
services:
  transcript:
    labels:
      io.transcript-library.run: ${DOCKER_RUN_ID:-manual}
    image: ${COMPOSE_PROJECT_NAME:-transcript-library}-transcript
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ${TRANSCRIPT_ENV_FILE:-.env}
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      API_ACCESS_KEY: ${API_ACCESS_KEY:-}
      DATA_ROOT: /data/transcripts
      RAG_DATA_ROOT: /data/lancedb
      RAG_MODEL_ROOT: /app/models
      YT_DLP_PATH: yt-dlp
      FFMPEG_PATH: ffmpeg
    volumes:
      - transcript-data:/data
    healthcheck:
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 24
    stop_grace_period: 20s

  library:
    labels:
      io.transcript-library.run: ${DOCKER_RUN_ID:-manual}
    image: ${COMPOSE_PROJECT_NAME:-transcript-library}-library
    build:
      context: ./services/channel-library
      dockerfile: Dockerfile
    env_file:
      - path: ${LIBRARY_ENV_FILE:-services/channel-library/.env}
        required: false
    environment:
      LIBRARY_HOST: 0.0.0.0
      LIBRARY_PORT: '3100'
      LIBRARY_DATA_DIR: /data/library
      TRANSCRIPT_API_URL: http://transcript:3000
      TRANSCRIPT_API_KEY: ${API_ACCESS_KEY:-}
    volumes:
      - library-data:/data/library
    depends_on:
      transcript:
        condition: service_healthy
    stop_grace_period: 20s

  web:
    labels:
      io.transcript-library.run: ${DOCKER_RUN_ID:-manual}
    image: ${COMPOSE_PROJECT_NAME:-transcript-library}-web
    build:
      context: ./services/channel-library
      dockerfile: web/Dockerfile
    ports:
      - '127.0.0.1:${DOCKER_WEB_PORT:-0}:8080'
    depends_on:
      library:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 10s

volumes:
  transcript-data:
  library-data:
