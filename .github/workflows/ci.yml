name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Restore pinned RAG model cache
        id: rag-model-cache
        uses: actions/cache/restore@v4
        with:
          path: .models
          key: rag-model-${{ runner.os }}-${{ hashFiles('src/infrastructure/rag/model-manifest.ts') }}
      - name: Build model manifest
        run: npm run build
      - name: Fetch and verify pinned RAG model
        run: npm run rag:model:fetch
      - name: Save verified pinned RAG model cache
        if: steps.rag-model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .models
          key: rag-model-${{ runner.os }}-${{ hashFiles('src/infrastructure/rag/model-manifest.ts') }}
      - name: Run source gates
        run: npm run check
      - name: Run offline RAG gates
        run: npm run test:rag:offline
      - name: Audit production dependencies
        run: npm audit --omit=dev

  container:
    name: Container build
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build offline RAG smoke image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: rag-smoke
          push: false
      - name: Build production image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
